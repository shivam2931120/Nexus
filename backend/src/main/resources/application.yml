spring:
  application:
    name: nexus-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DATABASE_USERNAME:nexus}
    password: ${DATABASE_PASSWORD:nexus}
    hikari:
      data-source-properties:
        prepareThreshold: ${PG_PREPARE_THRESHOLD:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    schemas: public,nexus_auth,org,chat,project,document,calendar,nexus_storage,notification,audit,meeting,integration,knowledge,whiteboard
    create-schemas: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
nexus:
  jwt:
    secret: ${JWT_SECRET:change-me-in-local-development-to-a-long-secret-key}
    issuer: ${JWT_ISSUER:nexus-local}
    access-minutes: 15
    refresh-days: 7
  nemotron:
    api-key: ${NVIDIA_API_KEY:${NEMOTRON_API_KEY:}}
    api-url: ${NEMOTRON_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
    model: ${NEMOTRON_MODEL:nvidia/nemotron-3-nano-30b-a3b}
server:
  port: ${PORT:${SERVER_PORT:8080}}
livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
clerk:
  jwt-issuer: ${CLERK_JWT_ISSUER:}
