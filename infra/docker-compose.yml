services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports: ["15432:5432"]
    volumes: [nexus-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nexus
      DATABASE_USERNAME: nexus
      DATABASE_PASSWORD: nexus
      CLERK_JWT_ISSUER: ${CLERK_JWT_ISSUER:-https://uncommon-tadpole-96.clerk.accounts.dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-development-to-a-long-secret-key}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_dW5jb21tb24tdGFkcG9sZS05Ni5jbGVyay5hY2NvdW50cy5kZXYk}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  nexus-postgres:
